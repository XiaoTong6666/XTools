[package]
name = "tools-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spdlog-rs = { version = "0.5.3", features = ["native", "android-ndk"] }


[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "debuginfo"
